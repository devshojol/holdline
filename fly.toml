# Fly.io configuration for the multiplayer game server (docs/multiplayer.md, "Deploying").
# Reference: https://fly.io/docs/reference/configuration/
#
# The sites allowed to connect are not in this file: they are the secret ALLOWED_ORIGINS
# (`fly secrets set ALLOWED_ORIGINS=https://a.example,https://b.example`).

app = 'tactical-aim-lab-server'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Fly's proxy passes each visitor's address in this header; without it every player would count
  # as one address and the per-address limits would lock everyone out together.
  CLIENT_IP_HEADER = 'fly-client-ip'
  PORT = '8787'

[http_service]
  internal_port = 8787
  force_https = true
  # Rooms live in this one machine's memory. It must never be stopped while idle, and Fly must never
  # start a second one: players on different machines could not find each other's rooms.
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
